[project]
name = "reader-library"
version = "0.1.0"
description = "Local delivery, search, and reading for the Reader library"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "fastembed>=0.8.1,<0.9",
    "pillow>=12.3.0,<13",
    "fonttools>=4,<5",
    "mcp>=1.28,<2",
    "pydantic>=2,<3",
    "pypdf>=6,<7",
    "pyyaml>=6,<7",
    "rapidfuzz>=3,<4",
]

[project.scripts]
reader = "reader_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reader_mcp"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
