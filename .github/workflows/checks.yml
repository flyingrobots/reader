name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare existing toolchain images
        run: |
          docker pull python:3.12-bookworm
          docker pull node:24.18.0
      - name: Python checks in bounded Docker worker
        run: python3 scripts/check_container.py python
      - name: Plugin checks in bounded Docker worker
        run: python3 scripts/check_container.py node
